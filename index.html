<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maestro rural conectado · Aula virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta: Pistachio #B9C255 · Frost #E6F1FA · Iced Denim #5798D7 */
    --denim: #5798D7; --pistachio: #B9C255; --frost: #E6F1FA;
    --tierra: #2E6AA6; --tierra-claro: #E6F1FA; --ocre: #B9C255; --ocre-claro: #EFF2D6;
    --ciruela: #66711C; --tinta: #1B2A3A; --gris: #566575; --linea: #CFDDEA;
    --fondo: #FFFFFF; --panel: #F3F8FC; --error: #B23A3A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --denim: #5798D7; --pistachio: #B9C255; --frost: #E6F1FA;
      --tierra: #8DBDEA; --tierra-claro: #1C2B3A; --ocre: #C9D16A; --ocre-claro: #2C3018;
      --ciruela: #C9D16A; --tinta: #E6F1FA; --gris: #A9B6C3; --linea: #2F4256;
      --fondo: #121A23; --panel: #18222D; --error: #E58A7A;
    }
  }
  :root[data-theme="dark"] {
    --denim: #5798D7; --pistachio: #B9C255; --frost: #E6F1FA;
    --tierra: #8DBDEA; --tierra-claro: #1C2B3A; --ocre: #C9D16A; --ocre-claro: #2C3018;
    --ciruela: #C9D16A; --tinta: #E6F1FA; --gris: #A9B6C3; --linea: #2F4256;
    --fondo: #121A23; --panel: #18222D; --error: #E58A7A;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--fondo); color: var(--tinta);
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    font-size: 1.0625rem; line-height: 1.6;
  }
  h1, h2, h3 { font-family: "Bitter", Georgia, "Times New Roman", serif; line-height: 1.2; margin: 0 0 .6em; }
  h1 { font-size: clamp(1.9rem, 4.5vw, 3rem); font-weight: 800; }
  h2 { font-size: clamp(1.4rem, 3vw, 1.9rem); color: var(--tierra); }
  h3 { font-size: 1.15rem; }
  p { margin: 0 0 1em; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ocre); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 290px 1fr; min-height: 100%; }

  /* Menú lateral */
  aside {
    background: var(--panel); border-right: 1px solid var(--linea);
    padding: 1.4rem 1rem; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .marca { font-family: "Bitter", Georgia, serif; font-weight: 800; font-size: 1.25rem; color: var(--tierra); margin-bottom: .2rem; }
  .marca-sub { color: var(--gris); font-size: .9rem; margin-bottom: 1.2rem; }
  .progreso-global { margin-bottom: 1.2rem; }
  .barra { height: 10px; background: var(--linea); border-radius: 5px; overflow: hidden; }
  .barra > span { display: block; height: 100%; background: var(--denim); transition: width .4s ease; }
  .progreso-global small { color: var(--gris); }
  nav ul { list-style: none; padding: 0; margin: 0; }
  nav li { margin-bottom: .25rem; }
  .nav-btn {
    width: 100%; text-align: left; background: none; border: 0; color: var(--tinta);
    padding: .55rem .65rem; border-radius: 5px; display: flex; gap: .6rem; align-items: center;
  }
  .nav-btn:hover { background: var(--tierra-claro); }
  .nav-btn[aria-current="page"] { background: var(--tierra); color: var(--fondo); }
  .nav-num { font-family: "Bitter", Georgia, serif; font-weight: 800; min-width: 2rem; }
  .nav-txt { flex: 1; font-size: .95rem; line-height: 1.3; }
  .nav-estado { width: 1.3rem; height: 1.3rem; border-radius: 50%; border: 2px solid currentColor; opacity: .55; display: grid; place-items: center; font-size: .75rem; }
  .nav-estado.hecho { background: var(--pistachio); border-color: var(--pistachio); color: #1B2A3A; opacity: 1; }
  .nav-sep { border-top: 1px solid var(--linea); margin: .8rem 0; }

  main { padding: 2rem clamp(1rem, 4vw, 3rem) 4rem; max-width: 960px; width: 100%; }
  .lectura { max-width: 70ch; }

  /* Inicio */
  .hero { border-bottom: 1px solid var(--linea); padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
  .hero .tipo { color: var(--ciruela); font-weight: 700; margin-bottom: .3rem; }
  .ruta-barra { display: flex; width: 100%; min-height: 78px; border-radius: 6px; overflow: hidden; border: 1px solid var(--linea); margin: 1rem 0 .4rem; }
  .ruta-barra button {
    border: 0; border-right: 2px solid var(--fondo); display: flex; flex-direction: column; justify-content: center;
    padding: .45rem .55rem; text-align: left; color: var(--tinta); min-width: 0; position: relative;
  }
  .ruta-barra button:last-child { border-right: 0; }
  .ruta-barra strong { font-family: "Bitter", Georgia, serif; }
  .ruta-barra small { font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ruta-barra .relleno { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--denim); transition: width .4s ease; }
  .c0 { background: var(--panel); } .c1, .c3, .c5 { background: var(--tierra-claro); } .c2, .c4 { background: var(--ocre-claro); }
  .c6 { background: var(--denim); color: #0F2236 !important; }
  .fichas { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
  .ficha { border-left: 4px solid var(--ocre); padding-left: .8rem; }
  .ficha b { display: block; font-family: "Bitter", Georgia, serif; font-size: 1.3rem; }
  .ficha span { color: var(--gris); font-size: .92rem; }
  .boton {
    background: var(--tierra); color: var(--fondo); border: 0; border-radius: 5px; padding: .65rem 1.2rem; font-weight: 700;
  }
  .boton.sec { background: transparent; color: var(--tierra); border: 2px solid var(--tierra); }
  .boton:disabled { opacity: .45; cursor: not-allowed; }

  /* Módulo */
  .mod-cabecera { margin-bottom: 1rem; }
  .mod-meta { color: var(--gris); margin-bottom: .8rem; }
  .objetivo { background: var(--panel); border-left: 4px solid var(--tierra); padding: .8rem 1rem; margin-bottom: 1rem; }
  .comp { display: inline-block; font-size: .85rem; background: var(--ocre-claro); padding: .1rem .55rem; border-radius: 3px; margin: 0 .3rem .3rem 0; }
  .pestanas { display: flex; gap: .3rem; border-bottom: 2px solid var(--linea); margin: 1.2rem 0 1.4rem; overflow-x: auto; }
  .pestanas button {
    background: none; border: 0; padding: .6rem .9rem; color: var(--gris); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap;
  }
  .pestanas button[aria-selected="true"] { color: var(--tierra); border-bottom-color: var(--tierra); font-weight: 700; }

  .leccion { border: 1px solid var(--linea); border-radius: 6px; margin-bottom: .8rem; }
  .leccion summary { cursor: pointer; padding: .8rem 1rem; display: flex; gap: .7rem; align-items: center; list-style: none; font-weight: 700; }
  .leccion summary::-webkit-details-marker { display: none; }
  .leccion[open] { border-color: var(--tierra); }
  .leccion .cuerpo { padding: 0 1rem 1rem; }
  .leccion .cuerpo ul { padding-left: 1.2rem; }
  .check { width: 1.4rem; height: 1.4rem; border-radius: 50%; border: 2px solid var(--linea); flex: none; display: grid; place-items: center; font-size: .8rem; }
  .check.ok { background: var(--tierra); border-color: var(--tierra); color: var(--fondo); }

  .actividad { display: flex; gap: 1rem; align-items: flex-start; border-bottom: 1px solid var(--linea); padding: 1rem 0; }
  .actividad input { width: 1.3rem; height: 1.3rem; margin-top: .25rem; accent-color: var(--tierra); flex: none; }
  .actividad label { cursor: pointer; }
  .tipo-act { font-size: .82rem; color: var(--ciruela); font-weight: 700; }

  .pregunta { margin-bottom: 1.4rem; }
  .pregunta fieldset { border: 0; padding: 0; margin: 0; }
  .pregunta legend { font-weight: 700; margin-bottom: .5rem; }
  .opcion { display: flex; gap: .6rem; align-items: flex-start; padding: .45rem .6rem; border-radius: 5px; border: 1px solid var(--linea); margin-bottom: .35rem; cursor: pointer; }
  .opcion input { margin-top: .3rem; accent-color: var(--tierra); }
  .opcion.bien { border-color: var(--tierra); background: var(--tierra-claro); }
  .opcion.mal { border-color: var(--error); }
  .fb { font-size: .95rem; margin-top: .4rem; }
  .fb.bien { color: var(--tierra); } .fb.mal { color: var(--error); }
  .resultado { padding: .8rem 1rem; border-radius: 6px; margin-top: 1rem; }
  .resultado.bien { background: var(--tierra-claro); } .resultado.mal { background: var(--ocre-claro); }

  .foro-consigna { background: var(--ocre-claro); padding: .8rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
  .post { border-left: 3px solid var(--linea); padding: .3rem 0 .3rem 1rem; margin-bottom: 1rem; }
  .post.tutor { border-left-color: var(--ciruela); }
  .post.propio { border-left-color: var(--tierra); }
  .post-autor { font-weight: 700; } .post-fecha { color: var(--gris); font-size: .85rem; }
  textarea { width: 100%; min-height: 110px; font: inherit; padding: .7rem; border: 1px solid var(--linea); border-radius: 6px; background: var(--fondo); color: var(--tinta); resize: vertical; }
  .aviso { color: var(--error); font-size: .95rem; }

  .pie-mod { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--linea); }

  .tabla-cont { overflow-x: auto; margin-bottom: 1.2rem; }
  table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: .96rem; }
  th, td { text-align: left; padding: .55rem .7rem; border-bottom: 1px solid var(--linea); vertical-align: top; }
  th { font-family: "Bitter", Georgia, serif; background: var(--panel); }
  td.num, th.num { text-align: right; }
  tfoot td { font-weight: 700; border-top: 2px solid var(--tierra); }
  .dos-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem 2rem; }
  .referencias p { padding-left: 2.2em; text-indent: -2.2em; }
  .pendiente { background: var(--ocre-claro); padding: 0 .3rem; border-radius: 3px; }

  .certificado { border: 3px double var(--ocre); padding: 2rem; text-align: center; border-radius: 8px; margin-top: 1rem; }
  .certificado h2 { color: var(--tierra); }

  /* Material de estudio */
  .tarjeta-lectura { border: 1px solid var(--linea); border-top: 5px solid var(--denim); border-radius: 8px; padding: 1.2rem 1.3rem; margin-bottom: 1.3rem; }
  .tarjeta-lectura h3 { margin-bottom: .3rem; }
  .tarjeta-lectura .meta { color: var(--gris); font-size: .93rem; margin-bottom: .8rem; }
  .tarjeta-lectura .reflexion { background: var(--ocre-claro); border-radius: 6px; padding: .7rem 1rem; }
  .guia { border-left: 4px solid var(--pistachio); padding: .2rem 0 .2rem 1rem; margin-bottom: 1.3rem; }
  .glosario dt { font-family: "Bitter", Georgia, serif; font-weight: 700; margin-top: .9rem; color: var(--tierra); }
  .glosario dd { margin: .2rem 0 0; }

  /* Juegos */
  .juego-panel { background: var(--panel); border-radius: 8px; padding: 1.3rem; }
  .marcador { display: flex; gap: 1.5rem; flex-wrap: wrap; color: var(--gris); margin-bottom: 1rem; }
  .marcador b { color: var(--tinta); }
  .memoria { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .7rem; }
  .carta {
    min-height: 110px; border: 2px solid var(--denim); border-radius: 8px; background: var(--denim);
    color: #0F2236; font-weight: 700; padding: .6rem; display: grid; place-items: center; text-align: center; font-size: .95rem;
  }
  .carta.abierta { background: var(--fondo); color: var(--tinta); }
  .carta.abierta.def { font-weight: 400; }
  .carta.hecha { background: var(--ocre-claro); border-color: var(--pistachio); color: var(--tinta); cursor: default; }
  .carta .dorso { font-size: 1.8rem; font-family: "Bitter", Georgia, serif; }
  .enunciado { font-size: 1.15rem; font-weight: 700; margin-bottom: .4rem; }
  .opciones-juego { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
  .opciones-juego .boton.sec.elegida-bien { background: var(--tierra-claro); }
  .opciones-juego .boton.sec.elegida-mal { border-color: var(--error); color: var(--error); }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--linea); }
    nav ul { display: flex; gap: .3rem; overflow-x: auto; padding-bottom: .3rem; }
    nav li { flex: none; margin: 0; }
    .nav-txt { display: none; }
    .nav-sep { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="marca">Maestro rural conectado</div>
    <div class="marca-sub">Aula virtual · 72 horas</div>
    <div class="progreso-global">
      <div class="barra" aria-hidden="true"><span id="barra-global" style="width:0%"></span></div>
      <small id="txt-global">0 % del curso completado</small>
    </div>
    <nav aria-label="Navegación del curso"><ul id="menu"></ul></nav>
  </aside>
  <main id="vista" tabindex="-1"></main>
</div>

<script>
/* =========================================================

   Escríbelos en formato APA 7 (texto plano; usa <em> para cursiva).
   Se ordenan alfabéticamente de forma automática.

const referencias = [

  "Giraldo Cardozo, J. C., &amp; Muñoz Vargas, I. C. (2025). Comunicación científica y ética en la era de la inteligencia artificial [Editorial]. <em>Acta Scientiæ Informaticæ, 9</em>(2). https://doi.org/10.21897/26192659.4189",

  // , "Apellido, A. (2023). Título del artículo. <em>Nombre de la revista, 10</em>(2), 1–20. https://doi.org/..."
];

/* =========================================================
   CONTENIDO DEL CURSO
   ========================================================= */
const modulos = [
  {
    id: "m0", num: "M0", titulo: "Bienvenida y diagnóstico", horas: 4, sinc: 2, aut: 2, semanas: "Semana 1",
    objetivo: "Familiarizarse con el aula virtual y las normas de participación, y reconocer el propio nivel de competencia digital.",
    comp: ["Tecnológica"],
    lecciones: [
      { t: "Cómo funciona este curso", c: "<p>El curso dura 72 horas repartidas en 9 semanas, con una dedicación aproximada de 8 horas semanales. Cada módulo tiene lecciones, actividades, una autoevaluación y un foro.</p><p>Todo el material se puede descargar desde la app de Moodle para estudiarlo sin conexión y sincronizar tu avance cuando tengas señal.</p>" },
      { t: "Pautas de participación y netiqueta", c: "<ul><li>En cada foro publica un aporte propio y responde al menos a dos colegas.</li><li>Escribe con respeto, de forma breve y clara.</li><li>Entrega tus actividades dentro de la semana indicada.</li><li>El tutor responde tus mensajes en un plazo máximo de 48 horas.</li></ul>" },
      { t: "¿Dónde estoy? Autodiagnóstico TIC", c: "<p>El MEN (2013) describe tres momentos en el desarrollo de las competencias TIC docentes: <strong>explorador</strong>, <strong>integrador</strong> e <strong>innovador</strong>. Este curso parte del nivel explorador y te acerca al integrador.</p><p>No estás solo en ese punto de partida: en un estudio con 241 docentes rurales de Antioquia, el 55 % se ubicó en el nivel explorador (Uribe-Zapata et al., 2023).</p><p>Antes de avanzar, responde con honestidad el cuestionario diagnóstico: no tiene nota y sirve para que el tutor adapte el acompañamiento.</p>" }
    ],
    actividades: [
      { tipo: "Sincrónica", t: "Encuentro de bienvenida", d: "Videoconferencia de 2 horas por Google Meet. Queda grabada para quien no pueda conectarse." },
      { tipo: "Foro", t: "Mi escuela y mi conexión", d: "Preséntate y cuenta cómo es tu sede y con qué conectividad cuentas." },
      { tipo: "Cuestionario", t: "Autodiagnóstico de competencias TIC", d: "Cuestionario diagnóstico, no calificable." }
    ],
    quiz: [
      { p: "¿Cuántas horas semanales se recomienda dedicar al curso?", o: ["2 horas", "8 horas", "20 horas"], ok: 1, fb: "Son 72 horas en 9 semanas, es decir, unas 8 horas por semana." },
      { p: "¿Cuál es la participación mínima esperada en cada foro?", o: ["Solo leer los aportes", "Un aporte propio y dos respuestas a colegas", "Un aporte propio"], ok: 1, fb: "La interacción entre pares es parte central del aprendizaje en red." },
      { p: "¿En cuánto tiempo responde el tutor como máximo?", o: ["48 horas", "Una semana", "Solo en los encuentros sincrónicos"], ok: 0, fb: "El tutor se compromete a responder en máximo 48 horas." }
    ],
    foro: "Preséntate: ¿cómo se llama tu sede, qué grados atiendes y cómo es la conectividad en tu escuela?",
    evaluacion: "Diagnóstica, no calificable."
  },
  {
    id: "m1", num: "M1", titulo: "Alfabetización digital y uso seguro", horas: 12, sinc: 2, aut: 10, semanas: "Semanas 1–2",
    objetivo: "Manejar funciones básicas del celular y el computador, gestionar archivos en la nube y aplicar prácticas de seguridad digital.",
    comp: ["Tecnológica"],
    lecciones: [
      { t: "Archivos y carpetas en la nube", c: "<p>Google Drive permite guardar documentos, fotos y videos y consultarlos desde cualquier dispositivo. Organiza tus archivos por periodo, grado y área, y usa nombres claros (por ejemplo, <em>2026_P3_Grado5_Ciencias</em>).</p>" },
      { t: "Ahorrar datos y trabajar sin conexión", c: "<ul><li>Descarga videos y documentos cuando tengas wifi.</li><li>Activa el modo sin conexión en Drive y en la app de Moodle.</li><li>Prefiere audios y PDF livianos sobre videos largos.</li></ul>" },
      { t: "Seguridad y protección de datos", c: "<p>Usa contraseñas largas (una frase fácil de recordar para ti) y activa la verificación en dos pasos. Los datos de tus estudiantes están protegidos por la Ley 1581 de 2012: no publiques fotos, notas ni datos personales en grupos abiertos o redes sociales.</p>" }
    ],
    actividades: [
      { tipo: "Tarea", t: "Organiza tu carpeta de planeación", d: "Crea en Drive la estructura de carpetas de tu periodo y sube una captura como evidencia." },
      { tipo: "Foro", t: "Riesgos digitales en mi comunidad", d: "Comparte un riesgo digital que hayas visto en tu escuela y cómo prevenirlo." },
      { tipo: "Cuestionario", t: "Cuestionario de seguridad digital", d: "Cinco preguntas sobre contraseñas, datos y ciudadanía digital." }
    ],
    quiz: [
      { p: "¿Cuál de estas contraseñas es más segura?", o: ["123456", "Maria1990", "MiEscuelaTieneTresSamanes!"], ok: 2, fb: "Una frase larga con mayúsculas y signos es más difícil de adivinar y fácil de recordar." },
      { p: "Con conexión intermitente, la mejor práctica es…", o: ["Ver los videos en línea cada vez", "Descargar el material con wifi y estudiarlo sin conexión", "Esperar a tener buena señal para todo"], ok: 1, fb: "Descargar con wifi ahorra datos y permite avanzar sin señal." },
      { p: "¿Qué debes evitar con los datos de tus estudiantes?", o: ["Guardarlos en una carpeta privada", "Publicar sus notas en un grupo abierto", "Pedir autorización a los acudientes"], ok: 1, fb: "Publicar datos personales en espacios abiertos vulnera su privacidad." }
    ],
    foro: "¿Qué riesgo digital has visto en tu comunidad escolar (estafas, fotos compartidas, contraseñas débiles…) y cómo lo prevendrías?",
    evaluacion: "Evidencia de la carpeta organizada y cuestionario (10 %)."
  },

/* =========================================================
   ESTADO (solo en memoria durante la sesión)
   ========================================================= */
const estado = {
  vista: "inicio",
  pestana: "lecciones",
  lecciones: {},     // "m1-0": true
  actividades: {},   // "m1-2": true
  quiz: {},          // "m1": {respuestas: [], nota: 2, enviado: true}
  foro: {}           // "m1": [{autor, texto, fecha}]
};

const $ = (s) => document.querySelector(s);

function progresoModulo(m) {
  const total = m.lecciones.length + m.actividades.length + 1;
  let hechos = 0;
  m.lecciones.forEach((_, i) => { if (estado.lecciones[m.id + "-" + i]) hechos++; });
  m.actividades.forEach((_, i) => { if (estado.actividades[m.id + "-" + i]) hechos++; });
  if (estado.quiz[m.id] && estado.quiz[m.id].aprobado) hechos++;
  return Math.round((hechos / total) * 100);
}
function progresoGlobal() {
  let horasHechas = 0;
  modulos.forEach(m => { horasHechas += m.horas * progresoModulo(m) / 100; });
  return Math.round((horasHechas / 72) * 100);
}

/* ---------- Menú ---------- */
function pintarMenu() {
  const items = [{ id: "inicio", num: "⌂", txt: "Inicio" }]
    .concat(modulos.map(m => ({ id: m.id, num: m.num, txt: m.titulo, m })))
    .concat([{ sep: true }, { id: "material", num: "📚", txt: "Material de estudio" }, { id: "juegos", num: "🎲", txt: "Juegos de repaso" }, { id: "info", num: "i", txt: "Información del curso" }, { id: "refs", num: "R", txt: "Referencias" }]);
  $("#menu").innerHTML = items.map(it => {
    if (it.sep) return '<li class="nav-sep" role="separator"></li>';
    const hecho = it.m && progresoModulo(it.m) === 100;
    const estadoIcono = it.m ? `<span class="nav-estado ${hecho ? "hecho" : ""}" aria-label="${hecho ? "completado" : "pendiente"}">${hecho ? "✓" : ""}</span>` : "";
    return `<li><button class="nav-btn" data-ir="${it.id}" ${estado.vista === it.id ? 'aria-current="page"' : ""}>
      <span class="nav-num">${it.num}</span><span class="nav-txt">${it.txt}</span>${estadoIcono}</button></li>`;
  }).join("");
  const g = progresoGlobal();
  $("#barra-global").style.width = g + "%";
  $("#txt-global").textContent = g + " % del curso completado";
}

function vistaModulo(m) {
  const idx = modulos.indexOf(m);
  const p = progresoModulo(m);
  const pestanas = [["lecciones", "Lecciones"], ["actividades", "Actividades"], ["quiz", "Autoevaluación"], ["foro", "Foro"]];
  let cuerpo = "";

  if (estado.pestana === "lecciones") {
    cuerpo = m.lecciones.map((l, i) => {
      const k = m.id + "-" + i, ok = estado.lecciones[k];
      return `<details class="leccion" data-leccion="${k}">
        <summary><span class="check ${ok ? "ok" : ""}">${ok ? "✓" : ""}</span>Lección ${i + 1}. ${l.t}</summary>
        <div class="cuerpo">${l.c}${ok ? "" : `<button class="boton sec" data-leida="${k}">Marcar como leída</button>`}</div>
      </details>`;
    }).join("");
  }

  if (estado.pestana === "actividades") {
    cuerpo = m.actividades.map((a, i) => {
      const k = m.id + "-" + i;
      return `<div class="actividad">
        <input type="checkbox" id="act-${k}" data-act="${k}" ${estado.actividades[k] ? "checked" : ""}>
        <label for="act-${k}"><span class="tipo-act">${a.tipo}</span><br><strong>${a.t}</strong><br>${a.d}</label>
      </div>`;
    }).join("") + `<p style="margin-top:1rem"><strong>Evaluación del módulo:</strong> ${m.evaluacion}</p>`;
  }

  if (estado.pestana === "quiz") {
    const q = estado.quiz[m.id] || { respuestas: [], enviado: false };
    cuerpo = `<p class="lectura">Responde las ${m.quiz.length} preguntas. Necesitas al menos ${m.quiz.length - 1} correctas para aprobar; puedes intentarlo las veces que quieras.</p>` +
      m.quiz.map((pr, i) => `<div class="pregunta"><fieldset><legend>${i + 1}. ${pr.p}</legend>
        ${pr.o.map((op, j) => {
          let cls = "";
          if (q.enviado && q.respuestas[i] === j) cls = j === pr.ok ? "bien" : "mal";
          return `<label class="opcion ${cls}"><input type="radio" name="q-${i}" value="${j}" ${q.respuestas[i] === j ? "checked" : ""} ${q.enviado ? "disabled" : ""}> ${op}</label>`;
        }).join("")}
        ${q.enviado ? `<p class="fb ${q.respuestas[i] === pr.ok ? "bien" : "mal"}">${q.respuestas[i] === pr.ok ? "Correcto. " : "Incorrecto. "}${pr.fb}</p>` : ""}
      </fieldset></div>`).join("") +
      (q.enviado
        ? `<div class="resultado ${q.aprobado ? "bien" : "mal"}" role="status"><strong>${q.nota} de ${m.quiz.length} correctas.</strong> ${q.aprobado ? "Autoevaluación aprobada." : "Repasa las lecciones e inténtalo de nuevo."}</div>
           <button class="boton sec" data-reintentar="${m.id}" style="margin-top:1rem">Intentar de nuevo</button>`
        : `<button class="boton" data-enviar-quiz="${m.id}">Enviar respuestas</button><p class="aviso" id="aviso-quiz" role="alert"></p>`);
  }

  if (estado.pestana === "foro") {
    const posts = [{ autor: "Tutor del curso", texto: "Bienvenidos al foro de este módulo. Recuerden publicar un aporte propio y responder al menos a dos colegas.", fecha: "Inicio del módulo", tipo: "tutor" }]
      .concat(estado.foro[m.id] || []);
    cuerpo = `<div class="foro-consigna"><strong>Consigna:</strong> ${m.foro}</div>
      ${posts.map(ps => `<div class="post ${ps.tipo}"><div><span class="post-autor">${ps.autor}</span> <span class="post-fecha">${ps.fecha}</span></div><p>${ps.texto}</p></div>`).join("")}
      <label for="nuevo-post"><strong>Tu aporte</strong></label>
      <textarea id="nuevo-post" placeholder="Escribe tu aporte aquí…"></textarea>
      <p class="aviso" id="aviso-foro" role="alert"></p>
      <button class="boton" data-publicar="${m.id}">Publicar aporte</button>`;
  }

  return `
  <div class="mod-cabecera">
    <p class="mod-meta">${m.num} · ${m.semanas} · ${m.horas} horas (${m.sinc} sincrónicas, ${m.aut} autónomas)</p>
    <h1>${m.titulo}</h1>
    <div class="barra" style="max-width:420px" aria-hidden="true"><span style="width:${p}%"></span></div>
    <small>${p} % del módulo completado</small>
  </div>
  <p class="objetivo"><strong>Objetivo:</strong> ${m.objetivo}</p>
  <div>${m.comp.map(c => `<span class="comp">Competencia ${c.toLowerCase()}</span>`).join("")}</div>
  <div class="pestanas" role="tablist">
    ${pestanas.map(([id, n]) => `<button role="tab" aria-selected="${estado.pestana === id}" data-pestana="${id}">${n}</button>`).join("")}
  </div>
  <div role="tabpanel">${cuerpo}</div>
  <div class="pie-mod">
    ${idx > 0 ? `<button class="boton sec" data-ir="${modulos[idx - 1].id}">Anterior: ${modulos[idx - 1].num}</button>` : `<span></span>`}
    ${idx < modulos.length - 1 ? `<button class="boton" data-ir="${modulos[idx + 1].id}">Siguiente: ${modulos[idx + 1].num}</button>` : `<button class="boton" data-ir="inicio">Volver al inicio</button>`}
  </div>`;
}

      <p>En la ruralidad colombiana el reto no es solo el acceso: en un estudio con 241 docentes rurales de Antioquia, el 97,1 % tenía celular, pero el 55 % se ubicaba en el nivel explorador de competencias TIC, y el uso de tecnologías para evaluar era muy inferior al uso para planear (Uribe-Zapata et al., 2023). A su vez, una experiencia de formación entre docentes por WhatsApp en Cundinamarca mostró que el aprendizaje móvil es viable aun con conectividad limitada y que los docentes piden más cursos en línea (Cifuentes Garzón y Burgos Calderón, 2023).</p>
      <p>El curso se fundamenta en las competencias TIC del MEN (2013), DigCompEdu (Redecker, 2017) y el marco de la UNESCO (2018); en la andragogía (Knowles et al., 2015) y el conectivismo (Siemens, 2005). El uso de IA generativa en su diseño se declara y verifica según principios de transparencia y autoría humana (Giraldo Cardozo y Muñoz Vargas, 2025).</p>

function barajar(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

  juegos.mem = { cartas: barajar(cartas), abiertas: [], hechas: [], intentos: 0, bloqueado: false };
}

  else if (estado.vista === "refs") html = vistaRefs();
  else if (estado.vista === "material") html = vistaMaterial();
  else if (estado.vista === "juegos") html = vistaJuegos();
  else if (m) html = vistaModulo(m);
  $("#vista").innerHTML = html;
  pintarMenu();
  if (enfocar) { window.scrollTo(0, 0); $("#vista").focus({ preventScroll: true }); }
}

/* ---------- Eventos ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;

  if (t.dataset.ir) { estado.vista = t.dataset.ir; estado.pestana = "lecciones"; render(true); return; }
  if (t.dataset.pestana) { estado.pestana = t.dataset.pestana; render(); return; }

  if (t.dataset.leida) {
    estado.lecciones[t.dataset.leida] = true;
    const abiertas = [...document.querySelectorAll("details.leccion[open]")].map(d => d.dataset.leccion);
    render();
    abiertas.forEach(k => { const d = document.querySelector(`details[data-leccion="${k}"]`); if (d) d.open = true; });
    return;
  }

  if (t.dataset.enviarQuiz) {
    const m = modulos.find(x => x.id === t.dataset.enviarQuiz);
    const respuestas = m.quiz.map((_, i) => {
      const sel = document.querySelector(`input[name="q-${i}"]:checked`);
      return sel ? Number(sel.value) : undefined;
    });
    if (respuestas.some(r => r === undefined)) { $("#aviso-quiz").textContent = "Responde todas las preguntas antes de enviar."; return; }
    const nota = respuestas.filter((r, i) => r === m.quiz[i].ok).length;
    estado.quiz[m.id] = { respuestas, nota, enviado: true, aprobado: nota >= m.quiz.length - 1 || (estado.quiz[m.id] && estado.quiz[m.id].aprobado) };
    render();
    return;
  }

  if (t.dataset.reintentar) {
    const previo = estado.quiz[t.dataset.reintentar];
    estado.quiz[t.dataset.reintentar] = { respuestas: [], enviado: false, aprobado: previo && previo.aprobado };
    render();
    return;
  }

  if (t.dataset.matTab) { estado.matTab = t.dataset.matTab; render(); return; }
  if (t.dataset.jueTab) { juegos.tab = t.dataset.jueTab; render(); return; }

  if (t.dataset.carta !== undefined) {
    const m = juegos.mem, i = Number(t.dataset.carta);
    if (m.bloqueado || m.abiertas.includes(i) || m.hechas.includes(m.cartas[i].k)) return;
    m.abiertas.push(i);
    if (m.abiertas.length === 2) {
      m.intentos++;
      const [a, b] = m.abiertas;
      if (m.cartas[a].k === m.cartas[b].k) { m.hechas.push(m.cartas[a].k); m.abiertas = []; render(); }
      else { m.bloqueado = true; render(); setTimeout(() => { m.abiertas = []; m.bloqueado = false; render(); }, 1200); }
    } else render();
    return;
  }
  if (t.dataset.memReiniciar) { nuevaMemoria(); render(); return; }

  if (t.dataset.cls !== undefined) {
    const g = juegos.cls; if (g.resp) return;
    g.resp = t.dataset.cls; if (g.resp === g.orden[g.i].c) g.aciertos++; render(); return;
  }
  if (t.dataset.clsSig) { juegos.cls.i++; juegos.cls.resp = null; render(); return; }
  if (t.dataset.clsReiniciar) { nuevoClasifica(); render(); return; }

  if (t.dataset.vf !== undefined) {
    const g = juegos.vf; if (g.resp !== null) return;
    g.resp = t.dataset.vf; if ((g.resp === "v") === g.orden[g.i].v) g.aciertos++; render(); return;
  }
  if (t.dataset.vfSig) { juegos.vf.i++; juegos.vf.resp = null; render(); return; }
  if (t.dataset.vfReiniciar) { nuevoVF(); render(); return; }

  if (t.dataset.publicar) {
    const txt = $("#nuevo-post").value.trim();
    if (txt.length < 20) { $("#aviso-foro").textContent = "Escribe un aporte de al menos 20 caracteres."; return; }
    const id = t.dataset.publicar;
    const seguro = txt.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
    estado.foro[id] = (estado.foro[id] || []).concat([{ autor: "Tú", texto: seguro, fecha: new Date().toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" }), tipo: "propio" }]);
    render();
  }
});

document.addEventListener("change", (e) => {
  if (e.target.dataset.act) { estado.actividades[e.target.dataset.act] = e.target.checked; render(); }
});

render();
</script>
</body>
